# Keeps the original project name, so the existing container and its data volume are reused
name: snip-api

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: snipsh
      POSTGRES_PASSWORD: snipsh
      POSTGRES_DB: snipsh
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres-data:
